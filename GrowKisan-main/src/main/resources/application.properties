# KisanFarm - runs on one port (8080)
spring.application.name=KisanFarm
server.port=8080

# MySQL (local dev: root/root, database kisanfarm)
spring.datasource.url=jdbc:mysql://localhost:3306/kisanfarm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create tables from schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# Ignore "column already exists" errors from idempotent ALTER statements.
spring.sql.init.continue-on-error=true

# ---- OTP / Auth ----
# Provider: mock (default, logs OTP to console) or twilio
kisanfarm.otp.provider=${OTP_PROVIDER:mock}
kisanfarm.otp.length=6
kisanfarm.otp.expiry-seconds=300
kisanfarm.otp.resend-cooldown-seconds=30
kisanfarm.otp.max-sends-per-hour=5
kisanfarm.otp.max-verify-attempts=5

# ---- Twilio (only used when provider=twilio). Set via environment variables. ----
kisanfarm.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
kisanfarm.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
kisanfarm.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
kisanfarm.twilio.from-number=${TWILIO_FROM_NUMBER:}
kisanfarm.twilio.default-country-code=+91

# ---- Payment ----
# provider: mock (default, instant success) or stripe
kisanfarm.payment.provider=${PAYMENT_PROVIDER:mock}
kisanfarm.payment.secret-key=${STRIPE_SECRET_KEY:}
kisanfarm.payment.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

# ---- Order pricing (backend-authoritative) ----
kisanfarm.order.delivery-charge=49.00
kisanfarm.order.free-delivery-threshold=499.00

# Never log OTP/secrets at INFO in production.
logging.level.com.kisanfarm=INFO

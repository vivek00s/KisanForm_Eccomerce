# KisanFarm - runs on one port (8080)
spring.application.name=KisanFarm
server.port=8080

# MySQL (local dev: root/root, database kisanfarm)
spring.datasource.url=jdbc:mysql://localhost:3306/kisanfarm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create tables from schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# Ignore "column already exists" errors from idempotent ALTER statements.
spring.sql.init.continue-on-error=true

# ---- OTP / Auth ----
# OTP delivery is handled exclusively by 2Factor.in. The app fails fast at
# startup if TWOFACTOR_API_KEY is not set (see TwoFactorOtpProvider).
kisanfarm.otp.provider=${OTP_PROVIDER:twofactor}
kisanfarm.otp.length=6
kisanfarm.otp.expiry-seconds=300
kisanfarm.otp.resend-cooldown-seconds=30
kisanfarm.otp.max-sends-per-hour=5
kisanfarm.otp.max-verify-attempts=5
# Per-IP hourly send cap. Deliberately higher than the per-mobile cap so shared
# networks (office/campus/carrier NAT) are not falsely blocked, while still
# stopping one source from spraying OTPs across many numbers.
kisanfarm.otp.max-sends-per-ip-per-hour=30

# ---- 2Factor.in (only used when provider=twofactor). Set the key via environment. ----
# The API key MUST come from the backend environment and is never exposed to the frontend.
kisanfarm.twofactor.api-key=${TWOFACTOR_API_KEY:}
kisanfarm.twofactor.base-url=https://2factor.in/API/V1
kisanfarm.twofactor.default-country-code=+91
kisanfarm.twofactor.connect-timeout-ms=5000
kisanfarm.twofactor.read-timeout-ms=10000

# ---- Payment ----
# provider: mock (default, instant success), stripe, or razorpay
kisanfarm.payment.provider=${PAYMENT_PROVIDER:mock}
kisanfarm.payment.secret-key=${STRIPE_SECRET_KEY:}
kisanfarm.payment.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

# ---- Razorpay (only used when provider=razorpay). Set via environment variables. ----
# Use rzp_test_* keys for Test Mode, rzp_live_* for real charges (after KYC).
# NEVER commit the key secret. The frontend only ever receives the key id.
kisanfarm.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
kisanfarm.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ---- Order pricing (backend-authoritative) ----
kisanfarm.order.delivery-charge=49.00
kisanfarm.order.free-delivery-threshold=499.00

# App logging. DEBUG locally shows the full OTP send/verify decision trail
# (rate-limit counts, attempt numbers, provider outcomes). The OTP value and
# API key are NEVER logged at any level. Set to INFO in production.
logging.level.com.kisanfarm=${KISANFARM_LOG_LEVEL:DEBUG}
